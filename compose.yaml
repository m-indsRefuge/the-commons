services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: commons
      POSTGRES_PASSWORD: commons
      POSTGRES_DB: the_commons
    ports:
      - "5432:5432"
    volumes:
      - commons-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commons -d the_commons"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  commons-postgres:
